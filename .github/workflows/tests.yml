name: tests-with-aws-emulator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS Emulator
        run: |
          curl -fsSLo aws-emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          sudo apt-get install -y ./aws-emulator.deb
          aws-emulator -v

      - name: Start the emulator in the background
        run: |
          nohup aws-emulator --telemetry off > emulator.log 2>&1 &
          for i in $(seq 30); do
            curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health && break
            sleep 1
          done
          # fail the step if the emulator did not answer within 30 seconds
          curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests against the emulator
        run: |
          source emulator-env.sh
          aws sts get-caller-identity
          pytest -q tests

      - name: Show the emulator log if something fails
        if: failure()
        run: cat emulator.log
